<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Portfolio | Nathan Lammers</title>
    <script>
      // SPA redirect trick for GitHub Pages
      // Stores the path in sessionStorage and redirects to root
      var path = window.location.pathname;
      sessionStorage.setItem('redirect', path);
      window.location.replace('/');
    </script>
  </head>
  <body></body>
</html>
